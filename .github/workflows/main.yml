name: Daily News Collector
on:
  schedule:
    - cron: '0 21 * * *'   # 매일 한국시간 오전 6시 (UTC 21:00)
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run script
        run: python main.py
